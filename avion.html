<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Avion — AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=League+Spartan:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --purple: #6742E2;
    --turquoise: #3BFAD2;
    --bg: #06070A;
    --bg-2: #0B0D14;
    --card: rgba(20, 22, 32, 0.55);
    --stroke: rgba(255, 255, 255, 0.06);
    --text: #E8ECF1;
    --muted: #9AA3B2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
    overflow-x: hidden;
  }

  body {
    position: relative;
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(103, 66, 226, 0.45), transparent 60%),
      radial-gradient(900px 500px at 50% 20%, rgba(59, 250, 210, 0.10), transparent 65%),
      linear-gradient(180deg, #06070A 0%, #04050A 100%);
  }

  /* Avion wave pattern strip — identical to brand pattern image, tiled */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='80' viewBox='0 0 320 80'><path d='M0 55 C 20 5, 60 5, 80 55 C 100 5, 140 5, 160 55 C 180 5, 220 5, 240 55 C 260 5, 300 5, 320 55' fill='none' stroke='%233BFAD2' stroke-width='3' stroke-linecap='round'/></svg>");
    background-size: 320px 80px;
    background-repeat: repeat;
    opacity: 0.12;
    pointer-events: none;
    z-index: 0;
  }

  /* Vignette to focus the center */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 35%, transparent 0%, rgba(6, 7, 10, 0.55) 70%, rgba(6, 7, 10, 0.9) 100%),
      radial-gradient(700px 400px at 50% 90%, rgba(59, 250, 210, 0.08), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Top bar */
  .topbar {
    position: relative;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 32px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Anton', sans-serif;
    letter-spacing: 2px;
    color: var(--turquoise);
    font-size: 22px;
  }

  .brand .logo {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--purple);
    display: grid; place-items: center;
    border: 2px solid var(--turquoise);
    box-shadow: 0 0 24px rgba(59, 250, 210, 0.35);
  }
  .brand .logo svg { width: 18px; height: 18px; }

  .profile {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'League Spartan', sans-serif;
    color: var(--muted);
    font-size: 14px;
  }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--purple), var(--turquoise));
    border: 2px solid rgba(255, 255, 255, 0.12);
  }

  /* Main */
  main {
    position: relative;
    z-index: 2;
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 32px 80px;
  }

  /* Orb */
  .orb-wrap {
    display: flex;
    justify-content: center;
    margin-top: 10px;
    margin-bottom: -40px;
  }
  .orb {
    width: 460px;
    height: 460px;
    position: relative;
    border-radius: 50%;
  }
  .orb::before {
    content: "";
    position: absolute;
    inset: 10%;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 60%, rgba(103, 66, 226, 0.55), transparent 60%),
      radial-gradient(circle at 50% 40%, rgba(59, 250, 210, 0.35), transparent 65%);
    filter: blur(40px);
    z-index: 0;
  }
  #stlCanvas {
    position: relative;
    width: 100%;
    height: 100%;
    z-index: 1;
    display: block;
  }
  @media (max-width: 860px) {
    .orb { width: 320px; height: 320px; }
  }

  /* Hero heading */
  .hero {
    margin-top: 24px;
  }
  .hero h1 {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: clamp(40px, 6vw, 72px);
    line-height: 1.05;
    letter-spacing: 1px;
    color: #fff;
  }
  .hero h1 .accent {
    color: var(--turquoise);
  }
  .hero h1 .row2 {
    display: block;
    color: #fff;
    margin-top: 6px;
  }

  /* Action cards */
  .cards {
    margin-top: 36px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }

  .card {
    position: relative;
    padding: 22px 22px 26px;
    border-radius: 18px;
    background: var(--card);
    border: 1px solid var(--stroke);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.25s ease, border-color 0.25s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: rgba(255, 255, 255, 0.14); }

  .card::after {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 18px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(59, 250, 210, 0.25), rgba(103, 66, 226, 0.25));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
    opacity: 0.7;
  }

  .chip {
    display: inline-block;
    padding: 7px 14px;
    border-radius: 8px;
    font-family: 'League Spartan', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.3px;
    color: #0B0D14;
  }
  .chip.blue   { background: #BFE2FF; }
  .chip.pink   { background: #FFC9C2; }
  .chip.green  { background: #C7F7C5; }

  .card .glow {
    position: absolute;
    width: 220px; height: 220px;
    border-radius: 50%;
    filter: blur(50px);
    opacity: 0.35;
    right: -50px; bottom: -80px;
    pointer-events: none;
  }
  .card.c1 .glow { background: #2BB6FF; }
  .card.c2 .glow { background: #FF6A57; }
  .card.c3 .glow { background: #3BFAD2; }

  .card p {
    margin-top: 22px;
    color: #D7DBE3;
    font-size: 15px;
    font-weight: 400;
  }

  /* Composer */
  .composer {
    margin-top: 26px;
    padding: 18px 18px 14px;
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(20, 23, 33, 0.7), rgba(12, 14, 22, 0.7));
    border: 1px solid var(--stroke);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
  }

  .composer .sparkle {
    color: var(--turquoise);
    font-size: 18px;
    margin-bottom: 6px;
  }

  .composer .input {
    width: 100%;
    background: transparent;
    border: 0;
    outline: none;
    color: var(--text);
    font-family: 'Poppins', sans-serif;
    font-size: 16px;
    padding: 10px 4px 18px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  }
  .composer .input::placeholder { color: #6E7587; }

  .composer .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
  }

  .attach {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border-radius: 12px;
    border: 1px solid var(--stroke);
    background: rgba(255, 255, 255, 0.04);
    color: #D7DBE3;
    font-family: 'League Spartan', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .attach:hover { background: rgba(255, 255, 255, 0.07); }
  .attach svg { width: 14px; height: 14px; }

  .send {
    width: 46px; height: 46px;
    border-radius: 14px;
    border: 0;
    cursor: pointer;
    background: var(--turquoise);
    color: #062018;
    display: grid; place-items: center;
    box-shadow: 0 12px 30px rgba(59, 250, 210, 0.35);
    transition: transform 0.15s ease;
  }
  .send:hover { transform: translateY(-1px); }
  .send svg { width: 18px; height: 18px; }

  /* Chat view */
  .chat {
    display: none;
    flex-direction: column;
    gap: 18px;
    min-height: calc(100vh - 240px);
    padding-bottom: 40px;
  }
  body.chat-mode .orb-wrap,
  body.chat-mode .hero,
  body.chat-mode .cards { display: none; }
  body.chat-mode .chat { display: flex; }
  body.chat-mode main { padding-top: 16px; }
  body.chat-mode .composer {
    position: sticky;
    bottom: 16px;
  }

  .msg {
    max-width: 78%;
    padding: 14px 18px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.55;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--stroke);
    animation: slideIn 0.35s ease both;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, rgba(103, 66, 226, 0.85), rgba(103, 66, 226, 0.55));
    border-color: rgba(103, 66, 226, 0.6);
    color: #fff;
    border-bottom-right-radius: 6px;
  }

  .msg.bot {
    align-self: flex-start;
    background: rgba(20, 23, 33, 0.7);
    color: #E8ECF1;
    border-bottom-left-radius: 6px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .bot-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--purple);
    border: 2px solid var(--turquoise);
    display: grid; place-items: center;
    flex-shrink: 0;
    box-shadow: 0 0 16px rgba(59, 250, 210, 0.4);
  }
  .bot-avatar svg { width: 16px; height: 16px; }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 4px 0;
  }
  .typing span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--turquoise);
    opacity: 0.4;
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1.1); }
  }

  /* Responsive */
  @media (max-width: 860px) {
    .cards { grid-template-columns: 1fr; }
    .msg { max-width: 92%; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">
      <svg viewBox="0 0 64 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 24 C 10 4, 22 4, 30 24" stroke="#3BFAD2" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M34 8 C 42 28, 54 28, 62 8" stroke="#3BFAD2" stroke-width="5" stroke-linecap="round" fill="none"/>
      </svg>
    </span>
    AVION
  </div>
  <div class="profile">
    <span>Raf</span>
    <div class="avatar"></div>
  </div>
</header>

<main>
  <div class="orb-wrap">
    <div class="orb">
      <canvas id="stlCanvas"></canvas>
    </div>
  </div>

  <section class="hero">
    <h1>
      Hey! <span class="accent">Raf</span>
      <span class="row2">What can I help with?</span>
    </h1>
  </section>

  <section class="cards">
    <div class="card c1">
      <span class="chip blue">Content Help</span>
      <p>Help with me create a Presentation</p>
      <div class="glow"></div>
    </div>
    <div class="card c2">
      <span class="chip pink">Suggestions</span>
      <p>Help with me ideas</p>
      <div class="glow"></div>
    </div>
    <div class="card c3">
      <span class="chip green">Job Application</span>
      <p>Help with me apply for job application</p>
      <div class="glow"></div>
    </div>
  </section>

  <section class="chat" id="chat"></section>

  <section class="composer">
    <div class="sparkle">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M12 2l1.6 4.4L18 8l-4.4 1.6L12 14l-1.6-4.4L6 8l4.4-1.6L12 2z" fill="#3BFAD2"/>
        <path d="M19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8L19 14z" fill="#3BFAD2" opacity=".8"/>
      </svg>
    </div>
    <input class="input" type="text" placeholder="Ask me anything......." />
    <div class="row">
      <button class="attach" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66L9.41 17.41a2 2 0 01-2.83-2.83l8.49-8.49"/>
        </svg>
        Attach file
      </button>
      <button class="send" id="sendBtn" type="button" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/>
          <polyline points="5 12 12 5 19 12"/>
        </svg>
      </button>
    </div>
  </section>
</main>

<script>
  const input   = document.querySelector('.composer .input');
  const sendBtn = document.getElementById('sendBtn');
  const chat    = document.getElementById('chat');
  const cards   = document.querySelectorAll('.card');

  const botAvatar = `<div class="bot-avatar">
    <svg viewBox="0 0 64 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 24 C 10 4, 22 4, 30 24" stroke="#3BFAD2" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M34 8 C 42 28, 54 28, 62 8" stroke="#3BFAD2" stroke-width="6" stroke-linecap="round" fill="none"/>
    </svg>
  </div>`;

  function addUserMsg(text) {
    const el = document.createElement('div');
    el.className = 'msg user';
    el.textContent = text;
    chat.appendChild(el);
    el.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  function addBotMsg(text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg bot';
    wrap.innerHTML = `${botAvatar}<div>${text}</div>`;
    chat.appendChild(wrap);
    wrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  function addTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg bot';
    wrap.id = 'typing';
    wrap.innerHTML = `${botAvatar}<div class="typing"><span></span><span></span><span></span></div>`;
    chat.appendChild(wrap);
    wrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function send() {
    const text = input.value.trim();
    if (!text) return;
    document.body.classList.add('chat-mode');
    addUserMsg(text);
    input.value = '';
    addTyping();
    setTimeout(() => {
      removeTyping();
      addBotMsg(`Got it Raf — here's a quick take on <strong>"${text}"</strong>. I can break it down into steps, draft something, or suggest options. What would you like next?`);
    }, 1100);
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

  cards.forEach(c => c.addEventListener('click', () => {
    input.value = c.querySelector('p').textContent.trim();
    input.focus();
  }));
</script>

</body>
</html>
